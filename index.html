<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>S PLUS LOAN APP - User</title>
<style>
:root{--gold:#ffd700;--bg:#111;--card:#202020;--green:#25d366}
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:Segoe UI,Arial,sans-serif}
.app{max-width:560px;min-height:100vh;margin:auto;background:#111}
header{background:linear-gradient(145deg,#ffd700,#9b7b00);color:#111;padding:15px 48px 15px 15px;text-align:center;font-weight:900;font-size:21px;position:relative;box-shadow:0 3px 12px #000}
.brand-s{font-size:30px;font-weight:1000;line-height:1;margin-right:2px}.gled{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#111;color:#0f0;border:2px solid #0f0;box-shadow:0 0 13px #0f0;font-weight:900}
.login{padding:35px 20px}
.login h2{text-align:center;color:var(--gold);margin-bottom:25px}
input{width:100%;padding:13px;margin:7px 0;border-radius:9px;border:1px solid #555;background:#222;color:#fff;font-size:16px}
.login button,.action{width:100%;border:0;border-radius:9px;padding:13px;font-weight:900;font-size:16px;cursor:pointer}
.gold{background:var(--gold);color:#111}
.err{color:#ff5555;text-align:center;min-height:22px;margin-top:8px;font-weight:bold}
.hidden{display:none!important}
.user-head{padding:15px 15px 8px;text-align:center}
.user-name{font-size:24px;font-weight:900;color:var(--gold)}
.user-mobile{font-size:13px;color:#aaa;margin-top:4px}.user-leader{font-size:15px;color:#25d366;margin-top:5px;font-weight:900}
.balance-card{margin:8px 12px 12px;padding:15px;border:2px solid var(--gold);border-radius:12px;background:linear-gradient(145deg,#292300,#171717);text-align:center}
.balance-card small{display:block;color:#aaa;font-weight:700;font-size:12px}
.balance{font-size:28px;color:var(--gold);font-weight:900;margin-top:4px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px}
.whatsapp{background:#25d366;color:#fff}
.pdf{background:#e53935;color:#fff}
.table-wrap{margin:0 12px 20px;overflow:hidden;border:1px solid #333;border-radius:10px;background:#111}
table{width:100% !important;min-width:0 !important;max-width:100% !important;border-collapse:collapse;table-layout:fixed}
th{background:#292929;color:var(--gold);padding:10px 2px;font-size:13px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:clip}
th:nth-child(1){width:19%}th:nth-child(2){width:24%}th:nth-child(3){width:17%}th:nth-child(4){width:17%}th:nth-child(5){width:23%}
td{width:auto;padding:10px 2px;border-top:1px solid #333;text-align:center;font-size:14px;font-weight:800;line-height:1.2;overflow:hidden;overflow-wrap:anywhere;word-break:break-word}
td.desc{text-align:center;white-space:normal}
td.balance-cell{font-size:13px;white-space:normal}
.credit{color:#35e879;font-weight:800}
.debit{color:#ff5555;font-weight:800}
.empty{text-align:center;color:#aaa;padding:25px}
.loading{text-align:center;color:#aaa;padding:30px}
@media(max-width:420px){header{font-size:18px}.user-name{font-size:21px}.balance{font-size:25px}.table-wrap{margin-left:8px;margin-right:8px}.table-wrap table{width:100%!important;min-width:0!important}.table-wrap th{font-size:11px;padding:8px 1px}.table-wrap td{font-size:12px;padding:9px 1px}.table-wrap th:nth-child(1){width:19%}.table-wrap th:nth-child(2){width:24%}.table-wrap th:nth-child(3){width:17%}.table-wrap th:nth-child(4){width:17%}.table-wrap th:nth-child(5){width:23%}.balance-cell{font-size:11px!important}}
@media print{
  body{background:#fff;color:#111}
  .app{max-width:none}
  header{box-shadow:none}
  .actions,.login{display:none!important}
  .balance-card{color:#111;border:2px solid #111;background:#fff}
  .balance-card small,.user-mobile,.user-leader{color:#333}
  .balance,.user-name,th{color:#111}
  table,th,td{border-color:#777}
}
</style>
</head>
<body>
<div class="app">

<header><span class="brand-s">S</span> PLUS LOAN APP <span class="gled">G</span></header>

<div id="loginPage" class="login">
  <h2>🔐 USER LOGIN</h2>
  <input id="userPassword" type="password" placeholder="Password" autocomplete="current-password">
  <button class="gold" onclick="loginUser()">LOGIN</button>
  <div id="loginError" class="err"></div>
</div>

<div id="userPage" class="hidden">
  <div class="user-head">
    <div id="userName" class="user-name"></div>
    <div id="userMobile" class="user-mobile"></div>
    <div id="userLeader" class="user-leader"></div>
  </div>

  <div class="balance-card">
    <small>TOTAL BALANCE</small>
    <div id="totalBalance" class="balance">₹ 0</div>
  </div>

  <div class="actions">
    <button class="action whatsapp" onclick="shareWhatsApp()">📱 WhatsApp</button>
    <button class="action pdf" onclick="downloadPDF()">📄 PDF</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Description</th>
          <th>Credit</th>
          <th>Debit</th>
          <th>Balance</th>
        </tr>
      </thead>
      <tbody id="transactions"></tbody>
    </table>
  </div>
</div>

</div>

<script>
const CLOUD_URL = "https://script.google.com/macros/s/AKfycbx8BkMWLe65CNNm2_Aezqg1OEgdC0SS3kz3L_g71rum__YHvF8GZS9HIYtizRRqldgZGw/exec";
let database = {users:[],leaders:[]};
let currentUser = null;

function money(n){
  return "₹ " + Number(n||0).toLocaleString("en-IN");
}

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function getBalance(u){
  return (u.transactions||[]).reduce((sum,t)=>{
    return sum + Number(t.credit||0) - Number(t.debit||0);
  },0);
}

async function loadCloud(){
  try{
    const r=await fetch(CLOUD_URL,{cache:"no-store"});
    if(!r.ok) throw new Error("Cloud error");
    const data=await r.json();
    database=data||{users:[],leaders:[]};
    database.users=Array.isArray(database.users)?database.users:[];
    database.leaders=Array.isArray(database.leaders)?database.leaders:[];
  }catch(e){
    database={users:[],leaders:[]};
    throw e;
  }
}

async function loginUser(){
  const password=document.getElementById("userPassword").value;
  const err=document.getElementById("loginError");
  err.textContent="";

  if(!password){
    err.textContent="Password உள்ளிடவும்.";
    return;
  }

  err.style.color="#aaa";
  err.textContent="Loading...";

  try{
    await loadCloud();
  }catch(e){
    err.style.color="#ff5555";
    err.textContent="Cloud connection கிடைக்கவில்லை.";
    return;
  }

  const matches=database.users.filter(x=>
    String(x.password||"")===String(password)
  );

  if(matches.length===0){
    err.style.color="#ff5555";
    err.textContent="Password தவறாக உள்ளது.";
    return;
  }

  if(matches.length>1){
    err.style.color="#ff5555";
    err.textContent="இந்த Password ஒன்றுக்கும் மேற்பட்ட Users-க்கு உள்ளது. தனிப்பட்ட Password பயன்படுத்தவும்.";
    return;
  }

  currentUser=matches[0];
  showUser();
}

function showUser(){
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("userPage").classList.remove("hidden");

  const leader=database.leaders.find(l=>String(l.id||"")===String(currentUser.leaderId||""));

  document.getElementById("userName").textContent=currentUser.name||"";
  document.getElementById("userMobile").textContent=currentUser.mobile||"";
  document.getElementById("userLeader").textContent=leader ? "👑 "+leader.name : "";

  document.getElementById("totalBalance").textContent=money(getBalance(currentUser));

  const tx=Array.isArray(currentUser.transactions)?currentUser.transactions:[];
  if(!tx.length){
    document.getElementById("transactions").innerHTML='<tr><td colspan="5" class="empty">Transactions இல்லை.</td></tr>';
    return;
  }

  // Latest entries first. Balance is calculated from oldest to newest,
  // then displayed in reverse order so new entries stay at the top.
  let running=0;
  const prepared=tx.map(t=>{
    running += Number(t.credit||0)-Number(t.debit||0);
    return {t, balance:running};
  }).reverse();

  document.getElementById("transactions").innerHTML=prepared.map(x=>{
    const t=x.t;
    return `<tr>
      <td>${esc(t.date||"")}</td>
      <td class="desc">${esc(t.desc||"")}</td>
      <td class="credit">${Number(t.credit||0)?money(t.credit):"-"}</td>
      <td class="debit">${Number(t.debit||0)?money(t.debit):"-"}</td>
      <td class="balance-cell">${money(x.balance)}</td>
    </tr>`;
  }).join("");
}

function shareWhatsApp(){
  if(!currentUser)return;

  const tx=Array.isArray(currentUser.transactions)?currentUser.transactions:[];
  let text=
`S PLUS LOAN APP
User: ${currentUser.name||""}
Mobile: ${currentUser.mobile||""}
Total Balance: ${money(getBalance(currentUser))}

Transactions:
`;

  tx.slice().reverse().forEach((t,i)=>{
    text+=`${i+1}. ${t.date||""} | ${t.desc||""} | Cr ${money(t.credit)} | Db ${money(t.debit)}\n`;
  });

  const url="https://wa.me/?text="+encodeURIComponent(text);
  window.open(url,"_blank");
}

function downloadPDF(){
  if(!currentUser)return;

  const tx=Array.isArray(currentUser.transactions)?currentUser.transactions:[];
  let rows=tx.map(t=>`
    <tr>
      <td>${esc(t.date||"")}</td>
      <td>${esc(t.desc||"")}</td>
      <td>${Number(t.credit||0)?money(t.credit):"-"}</td>
      <td>${Number(t.debit||0)?money(t.debit):"-"}</td>
    </tr>`).join("");

  const w=window.open("","_blank");
  if(!w){alert("PDF window open ஆகவில்லை. Browser popup allow செய்யவும்.");return;}

  w.document.write(`<!DOCTYPE html>
<html><head><title>User Statement</title>
<style>
body{font-family:Arial,sans-serif;padding:25px;color:#111}
h1{text-align:center;margin-bottom:5px}
.info{text-align:center;color:#444}
.balance{text-align:center;font-size:24px;font-weight:bold;margin:18px 0;padding:12px;border:2px solid #111}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #777;padding:8px;text-align:center}
th{background:#eee}
td:nth-child(2){text-align:left}
</style></head>
<body>
<h1>S PLUS LOAN APP</h1>
<div class="info">${esc(currentUser.name||"")} ${currentUser.mobile?" | "+esc(currentUser.mobile):""}</div>
<div class="balance">TOTAL BALANCE: ${money(getBalance(currentUser))}</div>
<table>
<thead><tr><th>Date</th><th>Description</th><th>Credit</th><th>Debit</th></tr></thead>
<tbody>${rows||'<tr><td colspan="4">Transactions இல்லை.</td></tr>'}</tbody>
</table>
<script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script>
</body></html>`);
  w.document.close();
}
</script>
</body>
</html>
