<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>S PLUS LOAN APP - User</title>
<style>
:root{--gold:#f5c451;--bg:#071426;--card:#10243d;--green:#25d366;--blue:#1677ff;--cyan:#45d6ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0%,#173b66 0,#08172b 48%,#050b14 100%);color:#fff;font-family:Segoe UI,Arial,sans-serif}
.app{max-width:560px;min-height:100vh;margin:auto;background:transparent;box-shadow:0 0 50px #0005}
header{background:linear-gradient(135deg,#0e2a4d,#1264b5 55%,#1a9acb);color:#fff;min-height:112px;padding:24px 18px;display:flex;align-items:center;justify-content:center;font-weight:900;position:relative;box-shadow:0 8px 25px #0007;border-bottom:3px solid #f5c451}
.brand{font-size:27px;font-weight:1000;line-height:1.1;white-space:nowrap;letter-spacing:1px;text-shadow:0 3px 12px #001a33}
.brand-s{display:none}
.brand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:25px;font-weight:1000;line-height:1.1;white-space:nowrap;letter-spacing:1.1px;text-align:center;text-shadow:0 2px 0 #06305c,0 4px 0 #06264a,0 7px 16px #001a33,0 0 18px #45d6ff66;max-width:calc(100% - 130px);background:linear-gradient(180deg,#ffffff 0%,#d9f5ff 38%,#f5c451 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 5px #45d6ff44)}
.gled{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#071426;color:#55ff82;border:2px solid #55ff82;box-shadow:0 0 13px #21ff67;font-weight:900}
.logout-btn{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:auto;border:1px solid #ff8585;border-radius:7px;padding:7px 8px;background:linear-gradient(135deg,#ff6969,#b90018);color:#fff;font-size:10px;font-weight:900;cursor:pointer;box-shadow:0 3px 10px #0006;letter-spacing:.2px}
.login-spinner{display:none;position:relative;margin:20px auto 0;width:58px;height:58px;border-radius:50%;background:conic-gradient(from 0deg,#45d6ff,#1677ff,#f5c451,#ff6b78,#45d6ff);animation:loginSpin .9s linear infinite;box-shadow:0 0 22px #45d6ff55}
.login-spinner:before{content:"";position:absolute;inset:6px;border-radius:50%;background:#08172b;border:2px solid #ffffff22}
.login-spinner:after{content:"S+";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:1000;text-shadow:0 0 8px #45d6ff}
.login-spinner.active{display:block}
@keyframes loginSpin{to{transform:rotate(360deg)}}
@media(max-width:420px){header{padding-left:78px;padding-right:55px}.brand{font-size:17px;max-width:calc(100% - 120px);letter-spacing:.2px}.logout-btn{left:7px;padding:6px 6px;font-size:9px}.gled{right:8px;width:30px;height:30px}}
 .login{padding:30px 24px 40px;min-height:calc(100vh - 112px);display:flex;flex-direction:column;justify-content:center;position:relative}
.login:before{content:"";position:absolute;inset:22px 12px 28px;border:1px solid #3da8ff55;border-radius:28px;pointer-events:none;box-shadow:inset 0 0 35px #147bd51a,0 18px 40px #0004}
.login h2{position:relative;text-align:center;color:#fff;margin:0 0 28px;font-size:25px;font-weight:1000;letter-spacing:1.4px}
.login h2:before{content:"";display:block;width:76px;height:76px;margin:0 auto 17px;border-radius:22px;background:linear-gradient(145deg,#39b9ff,#1454c8);box-shadow:0 9px 0 #092d69,0 14px 28px #0007;border:1px solid #8bdcff}
.login h2:after{content:"S+";position:absolute;left:50%;top:17px;transform:translateX(-50%);font-size:30px;font-weight:1000;color:#fff;text-shadow:0 2px 7px #00316a}
input{position:relative;width:100%;padding:15px 16px;margin:7px 0 14px;border-radius:13px;border:1px solid #3f6d9c;background:#08182a;color:#fff;font-size:16px;box-shadow:inset 0 2px 7px #0005}
.login button,.action{position:relative;width:100%;border:0;border-radius:13px;padding:15px;font-weight:1000;font-size:16px;cursor:pointer;letter-spacing:1px;transition:transform .15s,filter .15s}
.login button:active{transform:translateY(2px)}
.gold{background:linear-gradient(135deg,#ffe08a,#f2b82e);color:#15233a;box-shadow:0 5px 0 #9b6c0a,0 10px 20px #0005}
.err{position:relative;color:#ff6b78;text-align:center;min-height:22px;margin-top:14px;font-weight:bold}
.hidden{display:none!important}
.user-head{padding:15px 15px 8px;text-align:center}
.user-name{font-size:24px;font-weight:900;color:var(--gold)}
.user-mobile{font-size:13px;color:#aaa;margin-top:4px}.user-leader{font-size:19px;color:#25d366;margin-top:5px;font-weight:1000;text-shadow:0 0 1px #000}
.balance-card{margin:8px 12px 12px;padding:15px;border:2px solid var(--gold);border-radius:12px;background:linear-gradient(145deg,#292300,#171717);text-align:center}
.balance-card small{display:block;color:#aaa;font-weight:700;font-size:12px}
.balance{font-size:28px;color:var(--gold);font-weight:900;margin-top:4px}
.table-wrap{margin:0 12px 20px;overflow:hidden;border:1px solid #333;border-radius:10px;background:#111}
table{width:100% !important;min-width:0 !important;max-width:100% !important;border-collapse:collapse;table-layout:fixed}
th{background:#292929;color:var(--gold);padding:10px 2px;font-size:13px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:clip}
th:nth-child(1){width:19%}th:nth-child(2){width:24%}th:nth-child(3){width:17%}th:nth-child(4){width:17%}th:nth-child(5){width:23%}
td{width:auto;padding:10px 2px;border-top:1px solid #333;text-align:center;font-size:14px;font-weight:800;line-height:1.2;overflow:hidden;overflow-wrap:anywhere;word-break:break-word}
td.desc{text-align:center;white-space:normal}
td.balance-cell{font-size:13px;white-space:normal}
.credit{color:#fff;font-weight:900}.debit{color:#fff;font-weight:900}
tr.tx-credit td{background:#16851f;color:#fff;border-color:#249a2e}
tr.tx-debit td{background:#c9151b;color:#fff;border-color:#e12b31}
tr.tx-neutral td{background:#292929;color:#fff}
.empty{text-align:center;color:#aaa;padding:25px}
.loading{text-align:center;color:#aaa;padding:30px}
tr.tx-neutral td{background:#292300!important;color:#ffe16b!important;border-top:1px solid #b88b12!important;border-bottom:1px solid #b88b12!important;animation:pendingGlow 1.6s ease-in-out infinite}
tr.tx-neutral td.balance-cell{color:transparent!important;text-shadow:none!important}
@keyframes pendingGlow{0%,100%{background-color:#292300;box-shadow:inset 0 0 2px #f5c45122}50%{background-color:#574500;box-shadow:inset 0 0 14px #ffd84d88}}
@media(prefers-reduced-motion:reduce){tr.tx-neutral td{animation:none}}
@media(max-width:420px){header{min-height:100px;padding:20px 48px 20px 12px}.brand{font-size:22px}.brand-s{display:none}.user-name{font-size:21px}.balance{font-size:25px}.table-wrap{margin-left:8px;margin-right:8px}.table-wrap table{width:100%!important;min-width:0!important}.table-wrap th{font-size:11px;padding:8px 1px}.table-wrap td{font-size:12px;padding:9px 1px}.table-wrap th:nth-child(1){width:19%}.table-wrap th:nth-child(2){width:24%}.table-wrap th:nth-child(3){width:17%}.table-wrap th:nth-child(4){width:17%}.table-wrap th:nth-child(5){width:23%}.balance-cell{font-size:11px!important}.login{padding:25px 18px 35px}.login h2{font-size:22px}}.brand{font-size:18px}.brand-s{font-size:27px}.header-date{font-size:14px}.header-time{font-size:12px}.user-name{font-size:21px}.balance{font-size:25px}.table-wrap{margin-left:8px;margin-right:8px}.table-wrap table{width:100%!important;min-width:0!important}.table-wrap th{font-size:11px;padding:8px 1px}.table-wrap td{font-size:12px;padding:9px 1px}.table-wrap th:nth-child(1){width:19%}.table-wrap th:nth-child(2){width:24%}.table-wrap th:nth-child(3){width:17%}.table-wrap th:nth-child(4){width:17%}.table-wrap th:nth-child(5){width:23%}.balance-cell{font-size:11px!important}}
@media print{
  body{background:#fff;color:#111}
  .app{max-width:none}
  header{box-shadow:none}
  .actions,.login{display:none!important}
  .balance-card{color:#111;border:2px solid #111;background:#fff}
  .balance-card small,.user-mobile,.user-leader{color:#333}
  .balance,.user-name,th{color:#111}
  table,th,td{border-color:#777}
}
</style>
</head>
<body>
<div class="app">

<header>
  <button id="logoutBtn" class="logout-btn hidden" type="button" onclick="logoutUser()">LOG OUT</button>
  <div class="brand">S PLUS LOAN APP</div>
  <span class="gled" aria-label="Connection status">G</span>
</header>

<div id="loginPage" class="login">
  <h2>🔐 USER LOGIN</h2>
  <input id="userPassword" type="password" placeholder="Password" autocomplete="current-password">
  <button class="gold" onclick="loginUser()">LOGIN</button>
  <div id="loginError" class="err"></div>
  <div id="loginSpinner" class="login-spinner" role="status" aria-label="Loading"></div>
</div>

<div id="userPage" class="hidden">
  <div class="user-head">
    <div id="userName" class="user-name"></div>
    <div id="userMobile" class="user-mobile"></div>
    <div id="userLeader" class="user-leader"></div>
  </div>

  <div class="balance-card">
    <small>TOTAL BALANCE</small>
    <div id="totalBalance" class="balance">₹ 0</div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Description</th>
          <th>Credit</th>
          <th>Debit</th>
          <th>Balance</th>
        </tr>
      </thead>
      <tbody id="transactions"></tbody>
    </table>
  </div>
</div>

</div>

<script>
const CLOUD_URL = "https://script.google.com/macros/s/AKfycbx8BkMWLe65CNNm2_Aezqg1OEgdC0SS3kz3L_g71rum__YHvF8GZS9HIYtizRRqldgZGw/exec";
let database = {users:[],leaders:[]};
let currentUser = null;

function money(n){
  return "₹ " + Number(n||0).toLocaleString("en-IN");
}

function shortDate(v){
  const s=String(v??"").trim();
  if(!s) return "";
  // Display dates as D-M-YY, e.g. 2026-10-03 → 3-10-26
  let m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
  if(m) return `${Number(m[3])}-${Number(m[2])}-${m[1].slice(-2)}`;
  m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
  if(m) return `${Number(m[1])}-${Number(m[2])}-${m[3].slice(-2)}`;
  return s;
}

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function getBalance(u){
  return (u.transactions||[]).reduce((sum,t)=>{
    return sum + Number(t.credit||0) - Number(t.debit||0);
  },0);
}

async function loadCloud(){
  try{
    const r=await fetch(CLOUD_URL,{cache:"no-store"});
    if(!r.ok) throw new Error("Cloud error");
    const data=await r.json();
    database=data||{users:[],leaders:[]};
    database.users=Array.isArray(database.users)?database.users:[];
    database.leaders=Array.isArray(database.leaders)?database.leaders:[];
  }catch(e){
    database={users:[],leaders:[]};
    throw e;
  }
}

async function loginUser(){
  const password=document.getElementById("userPassword").value;
  const err=document.getElementById("loginError");
  err.textContent="";

  if(!password){
    err.textContent="Password உள்ளிடவும்.";
    return;
  }

  const spinner=document.getElementById("loginSpinner");
  const loginButton=document.querySelector("#loginPage button");
  spinner.classList.add("active");
  loginButton.disabled=true;
  loginButton.style.opacity=".7";
  err.style.color="#aaa";
  err.textContent="உள்நுழைகிறது...";

  try{
    await loadCloud();
  }catch(e){
    spinner.classList.remove("active");
    loginButton.disabled=false;
    loginButton.style.opacity="";
    err.style.color="#ff5555";
    err.textContent="Cloud connection கிடைக்கவில்லை.";
    return;
  }

  const matches=database.users.filter(x=>
    String(x.password||"")===String(password)
  );

  if(matches.length===0){
    spinner.classList.remove("active");
    loginButton.disabled=false;
    loginButton.style.opacity="";
    err.style.color="#ff5555";
    err.textContent="Password தவறாக உள்ளது.";
    return;
  }

  if(matches.length>1){
    spinner.classList.remove("active");
    loginButton.disabled=false;
    loginButton.style.opacity="";
    err.style.color="#ff5555";
    err.textContent="இந்த Password ஒன்றுக்கும் மேற்பட்ட Users-க்கு உள்ளது. தனிப்பட்ட Password பயன்படுத்தவும்.";
    return;
  }

  currentUser=matches[0];
  spinner.classList.remove("active");
  loginButton.disabled=false;
  loginButton.style.opacity="";
  showUser();
}

function showUser(){
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("userPage").classList.remove("hidden");
  document.getElementById("logoutBtn").classList.remove("hidden");

  const leader=database.leaders.find(l=>String(l.id||"")===String(currentUser.leaderId||""));

  document.getElementById("userName").textContent=currentUser.name||"";
  document.getElementById("userMobile").textContent=currentUser.mobile||"";
  document.getElementById("userLeader").textContent=leader ? "👑 "+leader.name : "";

  document.getElementById("totalBalance").textContent=money(getBalance(currentUser));

  const tx=Array.isArray(currentUser.transactions)?currentUser.transactions:[];
  if(!tx.length){
    document.getElementById("transactions").innerHTML='<tr><td colspan="5" class="empty">Transactions இல்லை.</td></tr>';
    return;
  }

  // Latest entries first. Balance is calculated from oldest to newest,
  // then displayed in reverse order so new entries stay at the top.
  let running=0;
  const prepared=tx.map(t=>{
    running += Number(t.credit||0)-Number(t.debit||0);
    return {t, balance:running};
  }).reverse();

  document.getElementById("transactions").innerHTML=prepared.map(x=>{
    const t=x.t;
    const rowClass = Number(t.debit||0) > 0 ? "tx-debit" : (Number(t.credit||0) > 0 ? "tx-credit" : "tx-neutral");
    return `<tr class="${rowClass}">
      <td>${esc(shortDate(t.date))}</td>
      <td class="desc">${esc(t.desc||"")}</td>
      <td class="credit">${Number(t.credit||0)?money(t.credit):"-"}</td>
      <td class="debit">${Number(t.debit||0)?money(t.debit):"-"}</td>
      <td class="balance-cell">${(Number(t.credit||0)===0 && Number(t.debit||0)===0) ? "-" : money(x.balance)}</td>
    </tr>`;
  }).join("");
}

function logoutUser(){
  currentUser=null;
  document.getElementById("userPage").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
  document.getElementById("logoutBtn").classList.add("hidden");
  document.getElementById("userPassword").value="";
  document.getElementById("loginError").textContent="";
  document.getElementById("loginError").style.color="#ff6b78";
  document.getElementById("loginSpinner").classList.remove("active");
  document.getElementById("userName").textContent="";
  document.getElementById("userMobile").textContent="";
  document.getElementById("userLeader").textContent="";
  document.getElementById("totalBalance").textContent="₹ 0";
  document.getElementById("transactions").innerHTML="";
}

function shareWhatsApp(){
  if(!currentUser)return;

  const tx=Array.isArray(currentUser.transactions)?currentUser.transactions:[];
  let text=
`S PLUS LOAN APP
User: ${currentUser.name||""}
Mobile: ${currentUser.mobile||""}
Total Balance: ${money(getBalance(currentUser))}

Transactions:
`;

  tx.slice().reverse().forEach((t,i)=>{
    text+=`${i+1}. ${shortDate(t.date)} | ${t.desc||""} | Cr ${money(t.credit)} | Db ${money(t.debit)}\n`;
  });

  const url="https://wa.me/?text="+encodeURIComponent(text);
  window.open(url,"_blank");
}

function downloadPDF(){
  if(!currentUser)return;

  const tx=Array.isArray(currentUser.transactions)?currentUser.transactions:[];
  let rows=tx.map(t=>`
    <tr>
      <td>${esc(shortDate(t.date))}</td>
      <td>${esc(t.desc||"")}</td>
      <td>${Number(t.credit||0)?money(t.credit):"-"}</td>
      <td>${Number(t.debit||0)?money(t.debit):"-"}</td>
    </tr>`).join("");

  const w=window.open("","_blank");
  if(!w){alert("PDF window open ஆகவில்லை. Browser popup allow செய்யவும்.");return;}

  w.document.write(`<!DOCTYPE html>
<html><head><title>User Statement</title>
<style>
body{font-family:Arial,sans-serif;padding:25px;color:#111}
h1{text-align:center;margin-bottom:5px}
.info{text-align:center;color:#444}
.balance{text-align:center;font-size:24px;font-weight:bold;margin:18px 0;padding:12px;border:2px solid #111}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #777;padding:8px;text-align:center}
th{background:#eee}
td:nth-child(2){text-align:left}
</style></head>
<body>
<h1>S PLUS LOAN APP</h1>
<div class="info">${esc(currentUser.name||"")} ${currentUser.mobile?" | "+esc(currentUser.mobile):""}</div>
<div class="balance">TOTAL BALANCE: ${money(getBalance(currentUser))}</div>
<table>
<thead><tr><th>Date</th><th>Description</th><th>Credit</th><th>Debit</th></tr></thead>
<tbody>${rows||'<tr><td colspan="4">Transactions இல்லை.</td></tr>'}</tbody>
</table>
<script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script>
</body></html>`);
  w.document.close();
}
</script>
</body>
</html>
